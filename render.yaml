services:
  - type: web
    name: polai-backend
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: ALLOWED_ORIGINS
        value: "*"
