name: Backend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Format Check
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Lint & Static Analysis (go vet)
        run: go vet ./...

      - name: Unit & Integration Tests
        run: go test -v -race ./...
